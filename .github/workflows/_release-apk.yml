name: L2 Android APK Release

on:
  workflow_call:
    inputs:
      project_name:
        required: true
        type: string
      release_number:
        required: true
        type: string
      release_apk_filename:
        required: true
        type: string
      expected_package_id:
        required: true
        type: string
      expected_cert_sha256:
        required: true
        type: string
      android_build_tools:
        required: false
        default: "35.0.0"
        type: string
      telegram_enabled:
        required: false
        default: true
        type: boolean
    secrets:
      ANDROID_KEYSTORE:
        required: true
      TELEGRAM_BOT_TOKEN:
        required: false
      TELEGRAM_CHAT_ID:
        required: false

jobs:
  build-sign-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Download source snapshot
        uses: actions/download-artifact@v4
        with:
          name: release-source
          path: source-package

      - name: Extract source snapshot
        shell: bash
        run: |
          set -euo pipefail
          test -s source-package/release-source.tar.gz
          tar -xzf source-package/release-source.tar.gz -C .

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Install Android build tools
        shell: bash
        env:
          BUILD_TOOLS: ${{ inputs.android_build_tools }}
        run: sdkmanager --install "build-tools;${BUILD_TOOLS}"

      - name: Build unsigned release APK
        env:
          RELEASE_VERSION_CODE: ${{ inputs.release_number }}
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:assembleRelease

      - name: Check unsigned APK
        shell: bash
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Sign and verify APK
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          RELEASE_NUMBER: ${{ inputs.release_number }}
          RELEASE_APK_FILENAME: ${{ inputs.release_apk_filename }}
          EXPECTED_PACKAGE_ID: ${{ inputs.expected_package_id }}
          EXPECTED_CERT_SHA256: ${{ inputs.expected_cert_sha256 }}
          BUILD_TOOLS: ${{ inputs.android_build_tools }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE:-}" ]; then
            echo "ANDROID_KEYSTORE is not configured"
            exit 1
          fi

          SIGN_DIR="$RUNNER_TEMP/android-signing"
          SIGN_ZIP="$RUNNER_TEMP/android-signing.zip"
          trap 'rm -rf "$SIGN_DIR" "$SIGN_ZIP"' EXIT

          mkdir -p "$SIGN_DIR"
          printf '%s' "$ANDROID_KEYSTORE" | base64 --decode > "$SIGN_ZIP"
          unzip -q "$SIGN_ZIP" -d "$SIGN_DIR"
          test -s "$SIGN_DIR/key.pk8"
          test -s "$SIGN_DIR/cert.pem"
          chmod 600 "$SIGN_DIR/key.pk8"

          CERT_SHA256=$(openssl x509 -in "$SIGN_DIR/cert.pem" -outform DER | sha256sum | awk '{print $1}')
          if [ "$CERT_SHA256" != "$EXPECTED_CERT_SHA256" ]; then
            echo "Unexpected Android signing certificate"
            exit 1
          fi

          APKSIGNER="$ANDROID_HOME/build-tools/${BUILD_TOOLS}/apksigner"
          AAPT="$ANDROID_HOME/build-tools/${BUILD_TOOLS}/aapt"
          UNSIGNED_APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          test -x "$APKSIGNER"
          test -x "$AAPT"

          "$APKSIGNER" sign --key "$SIGN_DIR/key.pk8" --cert "$SIGN_DIR/cert.pem" --out "$RELEASE_APK_FILENAME" "$UNSIGNED_APK"
          "$APKSIGNER" verify --verbose --print-certs "$RELEASE_APK_FILENAME"
          "$AAPT" dump badging "$RELEASE_APK_FILENAME" | grep -F "package: name='${EXPECTED_PACKAGE_ID}'"
          "$AAPT" dump badging "$RELEASE_APK_FILENAME" | grep -F "versionCode='${RELEASE_NUMBER}'"
          "$AAPT" dump badging "$RELEASE_APK_FILENAME" | grep -F "versionName='v${RELEASE_NUMBER}'"

      - uses: actions/upload-artifact@v4
        with:
          name: release-artifact
          path: ${{ inputs.release_apk_filename }}
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build-sign-verify
    uses: ./.github/workflows/_release-core.yml
    with:
      mode: publish
      project_name: ${{ inputs.project_name }}
      release_number: ${{ inputs.release_number }}
      artifact_filename: ${{ inputs.release_apk_filename }}

  telegram:
    if: ${{ inputs.telegram_enabled }}
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Send APK link to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PROJECT_NAME: ${{ inputs.project_name }}
          RELEASE_NUMBER: ${{ inputs.release_number }}
          RELEASE_APK_FILENAME: ${{ inputs.release_apk_filename }}
        shell: bash
        run: |
          set -u
          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ] || [ -z "${TELEGRAM_CHAT_ID:-}" ]; then
            echo "::warning::GitHub Release published, but Telegram secrets are not configured"
            exit 0
          fi

          API="https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}"
          RELEASE_TAG="v${RELEASE_NUMBER}"
          APK_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/${RELEASE_APK_FILENAME}"
          printf -v TEXT '%s %s собран успешно.\n\nСкачать APK:\n%s' "$PROJECT_NAME" "$RELEASE_TAG" "$APK_URL"

          SUCCESS=false
          for ATTEMPT in 1 2 3; do
            if RESPONSE=$(curl --silent --show-error --fail-with-body -X POST "$API/sendMessage" --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" --data-urlencode "text=${TEXT}"); then
              if printf '%s' "$RESPONSE" | jq -e '.ok == true' >/dev/null 2>&1; then
                SUCCESS=true
                break
              fi
            fi
            if [ "$ATTEMPT" -lt 3 ]; then
              sleep $((ATTEMPT * 5))
            fi
          done

          if [ "$SUCCESS" != "true" ]; then
            echo "::warning::GitHub Release published successfully, but Telegram notification failed after 3 attempts"
          fi
