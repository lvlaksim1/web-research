name: L2 Universal APK Release

on:
  workflow_call:
    inputs:
      mode:
        description: "release or validate"
        required: false
        default: "release"
        type: string
      project_name:
        description: "Human-readable project name"
        required: true
        type: string
      expected_package_id:
        required: true
        type: string
      expected_cert_sha256:
        required: true
        type: string
    secrets:
      ANDROID_KEYSTORE:
        required: true
      TELEGRAM_BOT_TOKEN:
        required: false
      TELEGRAM_CHAT_ID:
        required: false

jobs:
  prepare-release:
    uses: $/.github/workflows/_release-core.yml
    with:
      mode: prepare

  build-sign-verify:
    if: ${{ inputs.mode == 'validate' || needs.prepare-release.outputs.release_requested == 'true' }}
    needs: prepare-release
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      effective_release_number: ${{ steps.metadata.outputs.release_number }}
      apk_filename: ${{ steps.metadata.outputs.apk_filename }}
    steps:
      - name: Define APK metadata
        id: metadata
        env:
          MODE: ${{ inputs.mode }}
          RELEASE_REQUESTED: ${{ needs.prepare-release.outputs.release_requested }}
          PREPARED_RELEASE_NUMBER: ${{ needs.prepare-release.outputs.release_number }}
        shell: bash
        run: |
          set -euo pipefail

          case "$MODE" in
            release)
              test "$RELEASE_REQUESTED" = "true"
              [[ "$PREPARED_RELEASE_NUMBER" =~ ^[0-9]+$ ]]
              RELEASE_NUMBER="$PREPARED_RELEASE_NUMBER"
              ;;
            validate)
              RELEASE_NUMBER=9999
              ;;
            *)
              echo "Unsupported APK workflow mode: $MODE"
              exit 1
              ;;
          esac

          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          echo "release_number=$RELEASE_NUMBER" >> "$GITHUB_OUTPUT"
          echo "apk_filename=${REPO_NAME}-v${RELEASE_NUMBER}.apk" >> "$GITHUB_OUTPUT"

      - name: Checkout exact source commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Install universal APK tools
        shell: bash
        run: sdkmanager --install "build-tools;35.0.0"

      - name: Build project APK candidate
        id: project-build
        uses: $/.github/actions/build-apk
        with:
          release_number: ${{ steps.metadata.outputs.release_number }}

      - name: Check project APK candidate
        env:
          CANDIDATE_APK: ${{ steps.project-build.outputs.apk_path }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CANDIDATE_APK"
          test -s "$CANDIDATE_APK"

      - name: Sign and verify APK
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          RELEASE_NUMBER: ${{ steps.metadata.outputs.release_number }}
          RELEASE_APK_FILENAME: ${{ steps.metadata.outputs.apk_filename }}
          CANDIDATE_APK: ${{ steps.project-build.outputs.apk_path }}
          EXPECTED_PACKAGE_ID: ${{ inputs.expected_package_id }}
          EXPECTED_CERT_SHA256: ${{ inputs.expected_cert_sha256 }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${ANDROID_KEYSTORE:-}" ]; then
            echo "ANDROID_KEYSTORE is not configured"
            exit 1
          fi

          SIGN_DIR="$RUNNER_TEMP/android-signing"
          SIGN_ZIP="$RUNNER_TEMP/android-signing.zip"
          trap 'rm -rf "$SIGN_DIR" "$SIGN_ZIP"' EXIT

          mkdir -p "$SIGN_DIR"
          printf '%s' "$ANDROID_KEYSTORE" | base64 --decode > "$SIGN_ZIP"
          unzip -q "$SIGN_ZIP" -d "$SIGN_DIR"
          test -s "$SIGN_DIR/key.pk8"
          test -s "$SIGN_DIR/cert.pem"
          chmod 600 "$SIGN_DIR/key.pk8"

          CERT_SHA256=$(openssl x509 -in "$SIGN_DIR/cert.pem" -outform DER | sha256sum | awk '{print $1}')
          if [ "$CERT_SHA256" != "$EXPECTED_CERT_SHA256" ]; then
            echo "Unexpected Android signing certificate"
            exit 1
          fi

          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          test -x "$APKSIGNER"
          test -x "$AAPT"

          "$APKSIGNER" sign --key "$SIGN_DIR/key.pk8" --cert "$SIGN_DIR/cert.pem" --out "$RELEASE_APK_FILENAME" "$CANDIDATE_APK"
          "$APKSIGNER" verify --verbose --print-certs "$RELEASE_APK_FILENAME"
          "$AAPT" dump badging "$RELEASE_APK_FILENAME" | grep -F "package: name='${EXPECTED_PACKAGE_ID}'"
          "$AAPT" dump badging "$RELEASE_APK_FILENAME" | grep -F "versionCode='${RELEASE_NUMBER}'"
          "$AAPT" dump badging "$RELEASE_APK_FILENAME" | grep -F "versionName='v${RELEASE_NUMBER}'"

      - name: Verify APK native architecture
        env:
          RELEASE_APK_FILENAME: ${{ steps.metadata.outputs.apk_filename }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t ABIS < <(unzip -Z1 "$RELEASE_APK_FILENAME" | awk -F/ '$1 == "lib" && NF >= 3 {print $2}' | sort -u)

          if [ "${#ABIS[@]}" -eq 0 ]; then
            echo "APK contains no native libraries; architecture-independent APK accepted"
            exit 0
          fi

          printf 'Native ABIs: %s\n' "${ABIS[*]}"

          if ! printf '%s\n' "${ABIS[@]}" | grep -Fxq 'arm64-v8a'; then
            echo "APK does not contain required arm64-v8a native libraries"
            exit 1
          fi

          if printf '%s\n' "${ABIS[@]}" | grep -Fvxq 'arm64-v8a'; then
            echo "APK contains native ABI other than arm64-v8a"
            exit 1
          fi

      - name: Upload release APK artifact
        if: ${{ inputs.mode == 'release' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-artifact
          path: ${{ steps.metadata.outputs.apk_filename }}
          if-no-files-found: error
          retention-days: 1

      - name: Upload validation APK artifact
        if: ${{ inputs.mode == 'validate' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: work-branch-signed-apk
          path: ${{ steps.metadata.outputs.apk_filename }}
          if-no-files-found: error
          retention-days: 1

  publish:
    if: ${{ inputs.mode == 'release' }}
    needs: build-sign-verify
    uses: $/.github/workflows/_release-core.yml
    with:
      mode: publish
      project_name: ${{ inputs.project_name }}
      release_number: ${{ needs.build-sign-verify.outputs.effective_release_number }}
      artifact_filename: ${{ needs.build-sign-verify.outputs.apk_filename }}

  retain-apk-history:
    if: ${{ inputs.mode == 'release' }}
    needs:
      - build-sign-verify
      - publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Keep APKs only for current and previous releases
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_NUMBER: ${{ needs.build-sign-verify.outputs.effective_release_number }}
        shell: bash
        run: |
          set +e
          CURRENT_TAG="v${CURRENT_NUMBER}"

          RELEASE_TAGS=$(gh api --paginate "/repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[].tag_name')
          if [ $? -ne 0 ]; then
            echo "::warning::Could not list releases for APK retention cleanup"
            exit 0
          fi

          TAGS=$(printf '%s\n' "$RELEASE_TAGS" | grep -E '^v[0-9]+$' || true)
          PREVIOUS_NUMBER=$(printf '%s\n' "$TAGS" | sed 's/^v//' | awk -v current="$CURRENT_NUMBER" '$1 < current' | sort -n | tail -1)
          PREVIOUS_TAG=""
          if [ -n "$PREVIOUS_NUMBER" ]; then
            PREVIOUS_TAG="v${PREVIOUS_NUMBER}"
          fi

          CLEANUP_FAILED=false
          while read -r TAG; do
            [ -z "$TAG" ] && continue
            [ "$TAG" = "$CURRENT_TAG" ] && continue
            [ -n "$PREVIOUS_TAG" ] && [ "$TAG" = "$PREVIOUS_TAG" ] && continue

            ASSET_IDS=$(gh api "/repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '.assets[]? | select(.name | endswith(".apk")) | .id')
            if [ $? -ne 0 ]; then
              CLEANUP_FAILED=true
              continue
            fi

            while read -r ASSET_ID; do
              [ -z "$ASSET_ID" ] && continue
              if ! gh api --method DELETE "/repos/$GITHUB_REPOSITORY/releases/assets/$ASSET_ID" >/dev/null; then
                CLEANUP_FAILED=true
              fi
            done <<< "$ASSET_IDS"
          done <<< "$TAGS"

          if [ "$CLEANUP_FAILED" = "true" ]; then
            echo "::warning::Release succeeded, but some old APK assets could not be deleted"
          fi
          exit 0

  telegram:
    if: ${{ inputs.mode == 'release' }}
    needs:
      - build-sign-verify
      - publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send APK link to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PROJECT_NAME: ${{ inputs.project_name }}
          RELEASE_NUMBER: ${{ needs.build-sign-verify.outputs.effective_release_number }}
          RELEASE_APK_FILENAME: ${{ needs.build-sign-verify.outputs.apk_filename }}
        shell: bash
        run: |
          set -u

          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ] || [ -z "${TELEGRAM_CHAT_ID:-}" ]; then
            echo "::warning::GitHub Release published, but Telegram secrets are not configured"
            exit 0
          fi

          API="https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}"
          RELEASE_TAG="v${RELEASE_NUMBER}"
          APK_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/${RELEASE_APK_FILENAME}"
          printf -v TEXT '%s %s собран успешно.\n\nСкачать APK:\n%s' "$PROJECT_NAME" "$RELEASE_TAG" "$APK_URL"

          SUCCESS=false
          for ATTEMPT in 1 2 3; do
            if RESPONSE=$(curl --silent --show-error --fail-with-body -X POST "$API/sendMessage" --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" --data-urlencode "text=${TEXT}"); then
              if printf '%s' "$RESPONSE" | jq -e '.ok == true' >/dev/null 2>&1; then
                SUCCESS=true
                break
              fi
            fi
            if [ "$ATTEMPT" -lt 3 ]; then
              sleep $((ATTEMPT * 5))
            fi
          done

          if [ "$SUCCESS" != "true" ]; then
            echo "::warning::GitHub Release published successfully, but Telegram notification failed after 3 attempts"
          fi
