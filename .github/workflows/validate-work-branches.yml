name: Validate Android work branches

on:
  push:
    branches:
      - '*-work'

permissions:
  contents: write
  actions: write

jobs:
  validate-apk:
    uses: ./.github/workflows/_release-apk.yml
    with:
      mode: validate
      expected_package_id: web.research
      expected_cert_sha256: 336d50b20c93288a9bf6e7b41ec23341ff5bf21781b129daadadc11505da0c96
    secrets:
      ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
