name: Validate Android work branches
on:
  push:
    branches:
      - '*-work'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build unsigned release APK
        env:
          WEB_RESEARCH_VERSION_CODE: 9999
        run: ./gradlew :app:assembleRelease
      - name: Sign and verify test APK
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE:-}" ]; then
            echo "ANDROID_KEYSTORE is not configured"
            exit 1
          fi
          SIGN_DIR="$RUNNER_TEMP/web-research-signing"
          SIGN_ZIP="$RUNNER_TEMP/web-research-signing.zip"
          mkdir -p "$SIGN_DIR"
          printf '%s' "$ANDROID_KEYSTORE" | base64 --decode > "$SIGN_ZIP"
          unzip -q "$SIGN_ZIP" -d "$SIGN_DIR"
          test -s "$SIGN_DIR/key.pk8"
          test -s "$SIGN_DIR/cert.pem"
          chmod 600 "$SIGN_DIR/key.pk8"
          EXPECTED_CERT_SHA256="336d50b20c93288a9bf6e7b41ec23341ff5bf21781b129daadadc11505da0c96"
          CERT_SHA256=$(openssl x509 -in "$SIGN_DIR/cert.pem" -outform DER | sha256sum | awk '{print $1}')
          test "$CERT_SHA256" = "$EXPECTED_CERT_SHA256"
          UNSIGNED_APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          SIGNED_APK="web-research-signing-test.apk"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)
          test -x "$APKSIGNER"
          test -x "$AAPT"
          "$APKSIGNER" sign --key "$SIGN_DIR/key.pk8" --cert "$SIGN_DIR/cert.pem" --out "$SIGNED_APK" "$UNSIGNED_APK"
          "$APKSIGNER" verify --verbose --print-certs "$SIGNED_APK"
          "$AAPT" dump badging "$SIGNED_APK" | grep -F "versionCode='9999'"
          "$AAPT" dump badging "$SIGNED_APK" | grep -F "versionName='v9999'"
          rm -rf "$SIGN_DIR" "$SIGN_ZIP"
      - uses: actions/upload-artifact@v4
        with:
          name: work-branch-signed-apk
          path: web-research-signing-test.apk
