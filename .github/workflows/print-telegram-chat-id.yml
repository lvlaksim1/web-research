name: Print Telegram chat id

on:
  push:
    branches: [main]

jobs:
  print:
    runs-on: ubuntu-latest
    steps:
      - name: Print chat id
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          API="https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}"
          UPDATES=$(curl --silent --show-error --fail-with-body "$API/getUpdates?timeout=0")
          CHAT_ID=$(printf '%s' "$UPDATES" | jq -r '[.result[] | select(.message.chat.type == "private") | .message.chat.id] | last // empty')
          if [ -z "$CHAT_ID" ]; then
            echo "CHAT_ID_NOT_FOUND"
            exit 1
          fi
          echo "CHAT_ID=$CHAT_ID"
