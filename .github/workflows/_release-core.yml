name: L1 Universal Release Core

on:
  workflow_call:
    inputs:
      mode:
        description: "prepare or publish"
        required: true
        type: string
      project_name:
        description: "Human-readable project name"
        required: true
        type: string
      artifact_upload_name:
        description: "Actions artifact that contains the final release file"
        required: false
        default: "release-artifact"
        type: string
      artifact_filename:
        description: "Final release file name"
        required: false
        default: ""
        type: string
      release_number:
        description: "Numeric release version"
        required: false
        default: ""
        type: string
    outputs:
      release_requested:
        description: "true when the push commit requests a release"
        value: ${{ jobs.prepare.outputs.requested }}
      release_number:
        description: "Next numeric release version"
        value: ${{ jobs.prepare.outputs.number }}

jobs:
  prepare:
    if: ${{ inputs.mode == 'prepare' }}
    runs-on: ubuntu-latest
    outputs:
      requested: ${{ steps.gate.outputs.requested }}
      number: ${{ steps.version.outputs.number }}
    steps:
      - name: Check release request
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "push" ] && printf '%s' "$COMMIT_MESSAGE" | grep -Fq '[release]'; then
            echo "requested=true" >> "$GITHUB_OUTPUT"
          else
            echo "requested=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        if: ${{ steps.gate.outputs.requested == 'true' }}
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine next release version
        if: ${{ steps.gate.outputs.requested == 'true' }}
        id: version
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force
          LAST=$(git tag -l 'v[0-9]*' | sed 's/^v//' | grep -E '^[0-9]+$' | sort -n | tail -1)
          if [ -z "$LAST" ]; then LAST=0; fi
          NEXT=$((LAST + 1))
          echo "number=$NEXT" >> "$GITHUB_OUTPUT"

      - name: Prepare source snapshot
        if: ${{ steps.gate.outputs.requested == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=tar.gz --output="$RUNNER_TEMP/release-source.tar.gz" HEAD
          test -s "$RUNNER_TEMP/release-source.tar.gz"

      - name: Upload source snapshot
        if: ${{ steps.gate.outputs.requested == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: release-source
          path: ${{ runner.temp }}/release-source.tar.gz
          if-no-files-found: error
          retention-days: 1

  publish:
    if: ${{ inputs.mode == 'publish' }}
    runs-on: ubuntu-latest
    steps:
      - name: Validate release inputs
        shell: bash
        env:
          RELEASE_NUMBER: ${{ inputs.release_number }}
          ARTIFACT_FILENAME: ${{ inputs.artifact_filename }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_NUMBER" =~ ^[0-9]+$ ]]
          test -n "$ARTIFACT_FILENAME"

      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact_upload_name }}
          path: release-artifact

      - name: Validate artifact and calculate SHA-256
        id: hash
        shell: bash
        env:
          ARTIFACT_FILENAME: ${{ inputs.artifact_filename }}
        run: |
          set -euo pipefail
          FILE="release-artifact/${ARTIFACT_FILENAME}"
          test -s "$FILE"
          SHA256=$(sha256sum "$FILE" | awk '{print $1}')
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          printf '%s  %s\n' "$SHA256" "$ARTIFACT_FILENAME" > "${FILE}.sha256"

      - name: Ensure release tag is new
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v${{ inputs.release_number }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists"
            exit 1
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.release_number }}
          name: ${{ inputs.project_name }} v${{ inputs.release_number }}
          target_commitish: ${{ github.sha }}
          files: |
            release-artifact/${{ inputs.artifact_filename }}
            release-artifact/${{ inputs.artifact_filename }}.sha256
          make_latest: true
          generate_release_notes: true
          body: |
            Commit: `${{ github.sha }}`
            Artifact: `${{ inputs.artifact_filename }}`
            SHA-256: `${{ steps.hash.outputs.sha256 }}`

      - name: Delete current run Actions artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate "/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" --jq '.artifacts[].id' | while read -r ARTIFACT_ID; do
            [ -z "$ARTIFACT_ID" ] && continue
            gh api --method DELETE "/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID"
          done
