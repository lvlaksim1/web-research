name: L1 Universal Release Core

on:
  workflow_call:
    inputs:
      mode:
        description: "prepare or publish"
        required: true
        type: string
      project_name:
        description: "Human-readable project name; required for publish"
        required: false
        default: ""
        type: string
      artifact_filename:
        description: "Final release file name; required for publish"
        required: false
        default: ""
        type: string
      release_number:
        description: "Numeric release version; required for publish"
        required: false
        default: ""
        type: string
    outputs:
      release_requested:
        description: "true when the push commit requests a release"
        value: ${{ jobs.prepare.outputs.requested }}
      release_number:
        description: "Next numeric release version"
        value: ${{ jobs.prepare.outputs.number }}

jobs:
  prepare:
    if: ${{ inputs.mode == 'prepare' }}
    runs-on: ubuntu-latest
    outputs:
      requested: ${{ steps.gate.outputs.requested }}
      number: ${{ steps.version.outputs.number }}
    steps:
      - name: Check release request
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "push" ] && printf '%s' "$COMMIT_MESSAGE" | grep -Fq '[release]'; then
            echo "requested=true" >> "$GITHUB_OUTPUT"
          else
            echo "requested=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        if: ${{ steps.gate.outputs.requested == 'true' }}
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Determine next release version
        if: ${{ steps.gate.outputs.requested == 'true' }}
        id: version
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force
          LAST=$(git tag -l 'v[0-9]*' | sed 's/^v//' | grep -E '^[0-9]+$' | sort -n | tail -1)
          if [ -z "$LAST" ]; then LAST=0; fi
          NEXT=$((LAST + 1))
          echo "number=$NEXT" >> "$GITHUB_OUTPUT"

  publish:
    if: ${{ inputs.mode == 'publish' }}
    runs-on: ubuntu-latest
    steps:
      - name: Validate release inputs
        env:
          PROJECT_NAME: ${{ inputs.project_name }}
          RELEASE_NUMBER: ${{ inputs.release_number }}
          ARTIFACT_FILENAME: ${{ inputs.artifact_filename }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PROJECT_NAME"
          [[ "$RELEASE_NUMBER" =~ ^[0-9]+$ ]]
          test -n "$ARTIFACT_FILENAME"

      - name: Download release artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-artifact
          path: release-artifact

      - name: Validate artifact and calculate SHA-256
        id: hash
        env:
          ARTIFACT_FILENAME: ${{ inputs.artifact_filename }}
        shell: bash
        run: |
          set -euo pipefail
          FILE="release-artifact/${ARTIFACT_FILENAME}"
          test -s "$FILE"
          SHA256=$(sha256sum "$FILE" | awk '{print $1}')
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          printf '%s  %s\n' "$SHA256" "$ARTIFACT_FILENAME" > "${FILE}.sha256"

      - name: Publish verified GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          PROJECT_NAME: ${{ inputs.project_name }}
          RELEASE_NUMBER: ${{ inputs.release_number }}
          ARTIFACT_FILENAME: ${{ inputs.artifact_filename }}
          EXPECTED_SHA256: ${{ steps.hash.outputs.sha256 }}
        shell: bash
        run: |
          set -euo pipefail

          RELEASE_TAG="v${RELEASE_NUMBER}"
          FILE="release-artifact/${ARTIFACT_FILENAME}"
          SHA_FILE="${FILE}.sha256"
          VERIFY_DIR="$RUNNER_TEMP/release-verify"

          verify_published_release() {
            rm -rf "$VERIFY_DIR"
            mkdir -p "$VERIFY_DIR"
            gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$ARTIFACT_FILENAME" --pattern "${ARTIFACT_FILENAME}.sha256" --dir "$VERIFY_DIR"
            test -s "$VERIFY_DIR/$ARTIFACT_FILENAME"
            test -s "$VERIFY_DIR/${ARTIFACT_FILENAME}.sha256"
            REMOTE_SHA256=$(sha256sum "$VERIFY_DIR/$ARTIFACT_FILENAME" | awk '{print $1}')
            test "$REMOTE_SHA256" = "$EXPECTED_SHA256"
            grep -Fq "$EXPECTED_SHA256  $ARTIFACT_FILENAME" "$VERIFY_DIR/${ARTIFACT_FILENAME}.sha256"
            IS_DRAFT=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')
            test "$IS_DRAFT" = "false"
          }

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; verifying it for idempotent recovery"
            verify_published_release
            echo "Existing release matches the expected artifact"
            exit 0
          fi

          if gh api "/repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Tag $RELEASE_TAG already exists without a matching release"
            exit 1
          fi

          BODY=$(printf 'Commit: `%s`\nArtifact: `%s`\nSHA-256: `%s`' "$GITHUB_SHA" "$ARTIFACT_FILENAME" "$EXPECTED_SHA256")

          RELEASE_JSON=$(gh api --method POST "/repos/$GITHUB_REPOSITORY/releases" -f "tag_name=$RELEASE_TAG" -f "target_commitish=$GITHUB_SHA" -f "name=$PROJECT_NAME $RELEASE_TAG" -f "body=$BODY" -F draft=true -F prerelease=false -F generate_release_notes=true)
          RELEASE_ID=$(printf '%s' "$RELEASE_JSON" | jq -r '.id // empty')
          test -n "$RELEASE_ID"

          PUBLISHED=false
          rollback_draft() {
            if [ "$PUBLISHED" != "true" ]; then
              gh api --method DELETE "/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" >/dev/null 2>&1 || true
              gh api --method DELETE "/repos/$GITHUB_REPOSITORY/git/refs/tags/$RELEASE_TAG" >/dev/null 2>&1 || true
            fi
          }
          trap rollback_draft EXIT

          APK_ASSET_NAME=$(jq -rn --arg value "$ARTIFACT_FILENAME" '$value|@uri')
          SHA_ASSET_NAME=$(jq -rn --arg value "${ARTIFACT_FILENAME}.sha256" '$value|@uri')

          curl --silent --show-error --fail-with-body -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" -H "Content-Type: application/vnd.android.package-archive" --data-binary "@$FILE" "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?name=$APK_ASSET_NAME" >/dev/null
          curl --silent --show-error --fail-with-body -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" -H "Content-Type: text/plain" --data-binary "@$SHA_FILE" "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?name=$SHA_ASSET_NAME" >/dev/null

          ASSETS=$(gh api "/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?per_page=100")
          APK_OK=$(printf '%s' "$ASSETS" | jq --arg name "$ARTIFACT_FILENAME" '[.[] | select(.name == $name and .size > 0)] | length')
          SHA_OK=$(printf '%s' "$ASSETS" | jq --arg name "${ARTIFACT_FILENAME}.sha256" '[.[] | select(.name == $name and .size > 0)] | length')
          test "$APK_OK" = "1"
          test "$SHA_OK" = "1"

          gh api --method PATCH "/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" -F draft=false -f make_latest=true >/dev/null
          PUBLISHED=true
          trap - EXIT

          verify_published_release
          echo "Published and verified GitHub Release $RELEASE_TAG"

      - name: Clean current run Actions artifacts
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set +e
          CLEANUP_FAILED=false
          ARTIFACT_IDS=$(gh api --paginate "/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" --jq '.artifacts[].id')
          if [ $? -ne 0 ]; then
            echo "::warning::Could not list current run Actions artifacts"
            exit 0
          fi

          while read -r ARTIFACT_ID; do
            [ -z "$ARTIFACT_ID" ] && continue
            if ! gh api --method DELETE "/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" >/dev/null; then
              CLEANUP_FAILED=true
            fi
          done <<< "$ARTIFACT_IDS"

          if [ "$CLEANUP_FAILED" = "true" ]; then
            echo "::warning::Release processing completed, but some current-run Actions artifacts could not be deleted"
          fi
          exit 0
