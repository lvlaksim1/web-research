name: Build Android APK

on:
  push:
    branches: [main]

permissions:
  contents: write
  actions: write

concurrency:
  group: apk-release
  queue: max

jobs:
  release-apk:
    uses: ./.github/workflows/_release-apk.yml
    with:
      project_name: web research
      expected_package_id: web.research
      expected_cert_sha256: 336d50b20c93288a9bf6e7b41ec23341ff5bf21781b129daadadc11505da0c96
    secrets:
      ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
