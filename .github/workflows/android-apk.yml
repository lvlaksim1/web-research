name: Build Android APK

on:
  push:
    branches: [main]

permissions:
  contents: write
  actions: write

concurrency:
  group: web-research-release
  cancel-in-progress: false

jobs:
  prepare-release:
    uses: ./.github/workflows/_release-core.yml
    with:
      mode: prepare
      project_name: web research
    secrets: inherit

  release-apk:
    if: ${{ needs.prepare-release.outputs.release_requested == 'true' }}
    needs: prepare-release
    uses: ./.github/workflows/_release-apk.yml
    with:
      project_name: web research
      release_number: ${{ needs.prepare-release.outputs.release_number }}
      release_tag: ${{ needs.prepare-release.outputs.release_tag }}
      source_artifact_name: ${{ needs.prepare-release.outputs.source_artifact_name }}
      java_version: "17"
      build_command: "./gradlew :app:assembleRelease"
      version_name_env: WEB_RESEARCH_VERSION
      version_code_env: WEB_RESEARCH_VERSION_CODE
      unsigned_apk_path: app/build/outputs/apk/release/app-release-unsigned.apk
      release_apk_filename: web-research-v${{ needs.prepare-release.outputs.release_number }}.apk
      expected_package_id: web.research
      expected_cert_sha256: 336d50b20c93288a9bf6e7b41ec23341ff5bf21781b129daadadc11505da0c96
      android_build_tools: "35.0.0"
      telegram_enabled: true
    secrets: inherit
